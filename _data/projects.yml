  summary: >- # This means to ignore newlines until the next attribute. This summary is used for the overlay card content. 
    As software developers, we have often started new projects and then we forgot about it. 
    This mostly happens because we don't track what items we are working on and what the deadline 
    is. We might track a single repo and all the issues on it but what if we had one place which 
    would track all of our issues and send us reminders when we don't work a specific deadline 
    irrespective of what the repository may be. Presenting to you, GitDash..

# Second Dummy project
- title: EPC E-Filing System
  event: CSL tender award
  date: June 2021 - August 2021

  id: 2
  summary: >- # This means to ignore newlines until the next attribute
    Build and deployed a e-filing document management system for Electric Power Corporation of Samoa.
    This application helped automate, store and backup critical in-house documents for EPC. Prior,
    documents were paper-based but now using their filing index we digitalized this process to save
    time, paper and costs. This was a web application built on Angular and .Net Core. In addition,
    the application also had strict controls on what users could do particularly who can upload,
    view, download and archive files as well as searching.
