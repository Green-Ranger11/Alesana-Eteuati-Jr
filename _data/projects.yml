- title: eSIM Registration System
  event: Vodafone Samoa
  date: Nov 2022 - Present

  id: 1
  summary: >- # This means to ignore newlines until the next attribute
    Built and deployed an eSIM registration system to manage the creation and generation of eSIMs for Vodafone
    Samoa handsets. This system generated QR Codes for handsets to scan and load eSIMs. The system helped track
    creation, storage and automate all the processes involved in the generation of eSIM codes. Vodafone Samoa
    was the first network carrier in Samoa to have eSIM capability for supported devices. This was a full stack
    application with the following stack: React, Supabase, Express, Metabase along with supporting libraries.

  external_link: https://www.samoaobserver.ws/category/samoa/100683

