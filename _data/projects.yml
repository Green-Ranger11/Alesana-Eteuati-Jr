- title: can-merge
  event: Open Source
  date: October 2021 - Present

  github: https://github.com/ljharb/can-merge

  id: 3
  summary: >- # This means to ignore newlines until the next attribute
    Frequently contribute to can-merge. can-merge is a command-line utility that enables you to check 
    whether a certain pull request can actually be merged without navigating to the web UI. It uses 
    the GitHub GraphQL API to fetch the latest state of the status checks that might be running and 
    evaluates if the PR can be merged.

- title: E-Filing System
  event: Electric Power Corporation
  date: June 2021 - August 2021

  id: 4
  summary: >- # This means to ignore newlines until the next attribute
    Build and deployed a e-filing document management system for Electric Power Corporation of Samoa.
    This application helped automate, store and backup critical in-house documents for EPC. Prior,
    documents were paper-based but now using their filing index we digitalized this process to save
    time, paper and costs. This was a web application built on Angular and .Net Core. In addition,
    the application also had strict controls on what users could do particularly who can upload,
    view, download and archive files as well as searching.
