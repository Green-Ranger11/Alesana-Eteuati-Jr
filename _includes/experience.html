<h2 id="experience">Work Experience</h2>
<div class="container">
  <div class="row">
    <div class="col">
      {% for item in site.data.experience %}
      <div class="card transform">
        <div class="experience-icon d-flex align-items-center">
          <img
            src="./assets/img/experience/{{ item.logo }}"
            alt="{{ item.company }} logo"
          />
        </div>
        <div class="info">
          <p class="title text-center">{{ item.role }}</p>
          <p class="location text-center">{{ item.company }}</p>
          <p class="dates text-center">{{ item.dates }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
