<div class="home">
  <div class="d-flex flex-column justify-content-center mt-5 profile">
    <div class="mb-5 profile-picture">
      <img
        src="./assets/img/logo.png"
        alt="{{ site.title }}"
        class="rounded-circle"
      />
    </div>
    <h1>{{ site.title }}</h1>

    {% if site.resume %}
    <div>
      <button
        onclick="downloadResume('{{ site.title }} - Resume', '{{ site.resume }}')"
        class="download"
      >
        Check out my Resume!
      </button>
    </div>
    {% endif %}

    <div class="social d-flex flex-column">
      <div class="d-flex justify-content-center">
        <!-- If social links are defined in config then icons will show -->
        {% if site.social.github_username %}
        <div class="social-image">
          <a href="https://github.com/{{site.social.github_username}}">
            <img src="./assets/img/social/github.png" alt="Github" />
          </a>
        </div>
        {% endif %} {% if site.social.twitter_username %}
        <div class="social-image">
          <a href="https://twitter.com/{{site.social.twitter_username}}">
            <img src="./assets/img/social/twitter.png" alt="Twitter" />
          </a>
        </div>
        {% endif %} {% if site.social.linkedin_username %}
        <div class="social-image">
          <!-- This needs to be changed when used as a template to https://www.linkedin.com/in/ -->
          <a
            href="https://www.linkedin.com/in/{{site.social.linkedin_username}}"
          >
            <img src="./assets/img/social/linkedin.png" alt="Linkedin"
          /></a>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
</div>

{% if site.resume %}
<script>
  const downloadResume = (name, url) => {
    let link = document.createElement("a");
    link.href = url;
    link.download = `${name}.pdf`;
    link.dispatchEvent(new MouseEvent("click"));
    link.remove();
  };
</script>
{% endif %}
